# Checks on every push to main and every pull request (Linux only; the Apple
# tests run locally — see CLAUDE.md):
#   web      — the web test suite, then a regeneration of every generated file
#              (question bank, officials data, single-file artifact) that must
#              leave the tree unchanged.
#   android  — the JVM unit tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Generated files match their sources
        run: |
          npm run sync
          git diff --exit-code || {
            echo "::error::Generated files are stale or were edited by hand; run 'npm run sync' in web/ and commit the result."
            exit 1
          }

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew testDebugUnitTest
