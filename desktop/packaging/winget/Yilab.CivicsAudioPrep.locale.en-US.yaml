Moniker: civics-audio-prep
ShortDescription: Hands-free audio study tool for the US naturalization civics test
Description: |-
  Civics Audio Prep is a hands-free study tool for the US naturalization
  civics test (128 questions, 2025 version). The app speaks each question,
  pauses for you to answer aloud, then speaks the answer — highlighting the
  spoken word karaoke-style. Includes listen mode, flashcards, a question
  browser, a hands-free practice test that ends the moment you pass or fail
  (like the real interview), and 11 study languages. No ads, no data
  collection, works offline; headset and media-key controls supported.
